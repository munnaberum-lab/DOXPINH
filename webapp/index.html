<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Uptime Pro · Dotxbrain</title>
<meta name="author" content="Dotxbrain">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#12142b; --panel:#1b1f3f; --panel2:#222750; --line:#2c3263; --text:#eef0ff; --mute:#8d94c7;
  --violet:#6d5ef5; --violet-d:#4c3fd1; --mint:#22c997; --mint-d:#139a72;
  --amber:#ffb547; --coral:#ff5c7a; --coral-d:#cc3b57; --slate:#39407a; --slate-d:#272c58;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--ink);color:var(--text);font-family:Manrope,system-ui,sans-serif}
body{padding:calc(env(safe-area-inset-top,0px) + 14px) 14px calc(env(safe-area-inset-bottom,0px) + 92px)}
.sc{text-transform:lowercase;font-variant-caps:all-small-caps;letter-spacing:.04em}
header{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.logo{width:44px;height:44px;border-radius:14px;background:var(--violet);box-shadow:0 4px 0 var(--violet-d);display:grid;place-items:center;font-size:22px;flex:none}
h1{margin:0;font-size:24px;font-weight:800}
header p{margin:2px 0 0;color:var(--mute);font-size:13px}
header .grow{flex:1;min-width:0}
h3{margin:18px 0 10px;font-size:15px;color:var(--mute);font-weight:800}
.strip{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:11px 6px;text-align:center}
.stat b{display:block;font-size:22px;font-weight:800}
.stat span{font-size:12px;color:var(--mute)}
.add{display:flex;gap:8px;margin-bottom:12px}
input,select,textarea{flex:1;min-width:0;background:var(--panel);border:1.5px solid var(--line);border-radius:14px;padding:13px 14px;color:var(--text);font:600 15px Manrope,sans-serif;outline:none;width:100%}
textarea{resize:none;min-height:90px}
input:focus,textarea:focus{border-color:var(--violet)}
button{font:800 14px Manrope,sans-serif;color:#fff;border:0;border-radius:13px;padding:13px 14px;cursor:pointer;transition:transform .08s,box-shadow .08s}
button:active{transform:translateY(3px);box-shadow:none!important}
button:disabled{opacity:.55}
button:focus-visible,input:focus-visible,textarea:focus-visible,.card:focus-visible{outline:2px solid #fff;outline-offset:2px}
.b-violet{background:var(--violet);box-shadow:0 3px 0 var(--violet-d)}
.b-mint{background:var(--mint);box-shadow:0 3px 0 var(--mint-d);color:#06382a}
.b-coral{background:var(--coral);box-shadow:0 3px 0 var(--coral-d)}
.b-slate{background:var(--slate);box-shadow:0 3px 0 var(--slate-d)}
.b-sm{padding:9px 12px;font-size:13px;border-radius:11px}
.chips{display:flex;gap:7px;overflow-x:auto;margin-bottom:14px;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;background:var(--panel);border:1.5px solid var(--line);color:var(--mute);border-radius:99px;padding:8px 14px;font-size:13px;box-shadow:none}
.chip.on{background:var(--violet);border-color:var(--violet);color:#fff}
.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:15px;margin-bottom:12px;cursor:pointer}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.name{font-size:17px;font-weight:800;word-break:break-all}
.url{font-size:12px;color:var(--mute);word-break:break-all;margin-top:3px}
.pill{flex:none;padding:6px 11px;border-radius:99px;font-weight:800;font-size:13px;display:flex;align-items:center;gap:6px}
.pill i{width:8px;height:8px;border-radius:50%;background:currentColor}
.up{background:#12382f;color:var(--mint)} .sleeping{background:#43361a;color:var(--amber)}
.down{background:#47202c;color:var(--coral)} .new{background:var(--slate-d);color:var(--mute)}
.spark{display:block;width:100%;height:46px;margin:12px 0 4px}
.m{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.m div{background:var(--ink);border-radius:12px;padding:9px 6px;text-align:center}
.m b{display:block;font-size:15px} .m span{font-size:12px;color:var(--mute)}
.meter{height:7px;background:var(--ink);border-radius:9px;overflow:hidden}
.meter div{height:100%;background:var(--mint);border-radius:9px;transition:width .5s}
.tags{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.tag{font-size:12px;color:var(--mute);background:var(--ink);border-radius:8px;padding:4px 8px}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.acts .full{grid-column:1/-1}
.busy{position:relative;overflow:hidden}
.busy::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.25),transparent);animation:sweep 1.1s infinite}
@keyframes sweep{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
.skel{height:150px;border-radius:20px;background:var(--panel);margin-bottom:12px;animation:pulse 1.2s infinite alternate}
@keyframes pulse{from{opacity:.5}to{opacity:1}}
footer{text-align:center;color:var(--mute);font-size:13px;margin-top:22px}
footer b{color:var(--text)}
.empty{text-align:center;color:var(--mute);padding:36px 10px;font-weight:700}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:13px 14px;margin-bottom:10px}
.row .t{min-width:0} .row .t b{display:block;font-size:15px;word-break:break-all} .row .t span{font-size:12px;color:var(--mute)}
.switch{flex:none;width:52px;height:30px;border-radius:99px;background:var(--slate-d);position:relative;padding:0;box-shadow:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s}
.switch.on{background:var(--mint)} .switch.on::after{left:25px}
.nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--panel);border-top:1px solid var(--line);padding:8px 8px calc(env(safe-area-inset-bottom,0px) + 8px);z-index:4}
.nav button{flex:1;background:none;color:var(--mute);box-shadow:none;padding:8px 4px;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:3px}
.nav button span{font-size:20px} .nav button.on{color:#fff}
.nav button.on span{filter:drop-shadow(0 0 8px var(--violet))}
.sheet-bg{position:fixed;inset:0;background:rgba(5,6,18,.7);display:none;align-items:flex-end;z-index:8}
.sheet-bg.on{display:flex}
.sheet{width:100%;max-height:88vh;overflow:auto;background:var(--panel);border-radius:24px 24px 0 0;padding:20px 18px calc(env(safe-area-inset-bottom,0px) + 22px);animation:rise .22s ease-out}
@keyframes rise{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.sheet h2{margin:0 0 12px;font-size:20px;word-break:break-all}
.kv{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px;gap:12px}
.kv span{color:var(--mute)} .kv b{text-align:right;word-break:break-all}
.log{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}
.log em{font-style:normal;color:var(--mute);margin-left:auto}
.ivs{display:flex;gap:7px;margin:8px 0 14px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 86px);transform:translate(-50%,30px);background:#fff;color:#12142b;font-weight:800;padding:12px 18px;border-radius:14px;opacity:0;transition:.25s;z-index:9;pointer-events:none;max-width:90%}
.toast.on{opacity:1;transform:translate(-50%,0)}
.hide{display:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header>
  <div class="logo">🧠</div>
  <div class="grow"><h1 class="sc">uptime pro</h1><p class="sc">by dotxbrain · keep your sites awake</p></div>
  <button class="b-slate b-sm sc" id="checkAll">🔄 check all</button>
</header>

<main id="view"></main>

<footer class="sc">🔒 your links are private · powered by <b>dotxbrain</b></footer>

<nav class="nav" id="nav"></nav>
<div class="sheet-bg" id="bg"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script>
const tg = window.Telegram?.WebApp; tg?.ready(); tg?.expand();
tg?.setHeaderColor?.("#12142b"); tg?.setBackgroundColor?.("#12142b");
const $ = id => document.getElementById(id);
const LABEL = {up:"online", sleeping:"sleeping", down:"offline", new:"pending"};
const ICON = {up:"🟢", sleeping:"😴", down:"🔴", new:"⚪"};
const KIND = {ping:"🏓", wake:"☀️", auto:"🤖"};
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const S = {tab:"mon", filter:"all", q:"", data:[], me:null, loaded:false, atab:"over", ov:null, users:null, amons:null};

async function api(path, body) {
  const res = await fetch(path, {method: body ? "POST" : "GET",
    headers: {"X-Init-Data": tg?.initData || "", "Content-Type": "application/json"}, body: body ? JSON.stringify(body) : undefined});
  const j = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(j.error || (res.status === 401 ? "Open this inside Telegram" : "Request failed"));
  return j;
}
function toast(t) { const el = $("toast"); el.textContent = t; el.classList.add("on"); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove("on"), 2400); }
const buzz = type => tg?.HapticFeedback?.notificationOccurred?.(type);
function ago(ts) { if (!ts) return "never"; const d = Math.max(0, Math.floor(Date.now()/1000 - ts)); return d < 60 ? d+"s ago" : d < 3600 ? Math.floor(d/60)+"m ago" : d < 86400 ? Math.floor(d/3600)+"h ago" : Math.floor(d/86400)+"d ago"; }
function dur(s) { s = Math.floor(s); return s < 60 ? s+"s" : s < 3600 ? Math.floor(s/60)+"m" : s < 86400 ? Math.floor(s/3600)+"h "+Math.floor(s%3600/60)+"m" : Math.floor(s/86400)+"d "+Math.floor(s%86400/3600)+"h"; }
const COL = {up:"#22c997", sleeping:"#ffb547", down:"#ff5c7a", new:"#8d94c7"};

// response-time line: gaps (null) are drawn as red ticks
function sparkSvg(vals, status, h = 46) {
  const ok = vals.filter(v => v !== null);
  if (vals.length < 2 || !ok.length) return `<svg class="spark" viewBox="0 0 100 ${h}"><text x="50" y="${h/2+4}" fill="#8d94c7" font-size="10" text-anchor="middle">no data yet</text></svg>`;
  const lo = Math.min(...ok), hi = Math.max(...ok), W = 100, pad = 5, step = W / (vals.length - 1);
  const y = v => hi === lo ? h/2 : h - pad - (v - lo) / (hi - lo) * (h - pad*2);
  let d = "", ticks = "";
  vals.forEach((v, i) => { const x = i * step;
    if (v === null) ticks += `<line x1="${x}" x2="${x}" y1="${pad}" y2="${h-pad}" stroke="#ff5c7a" stroke-width="1.6" opacity=".7"/>`;
    else d += (d && vals[i-1] !== null ? " L" : " M") + x.toFixed(1) + " " + y(v).toFixed(1); });
  const c = COL[status] || COL.up;
  return `<svg class="spark" viewBox="0 0 ${W} ${h}" preserveAspectRatio="none">${ticks}<path d="${d}" fill="none" stroke="${c}" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}

// ───────────── monitors tab ─────────────
function monCard(m, admin) {
  return `<div class="card" tabindex="0" data-open="${m.id}" ${admin ? 'data-admin="1"' : ""}>
    <div class="top"><div><div class="name">${esc(m.name)}</div><div class="url">${esc(m.url)}</div></div>
      <div class="pill sc ${m.status}"><i></i>${LABEL[m.status]}</div></div>
    ${sparkSvg(m.spark || [], m.status)}
    <div class="m"><div><b>${m.last_ms} ms</b><span class="sc">response</span></div>
      <div><b>${m.uptime}%</b><span class="sc">uptime</span></div><div><b>${ago(m.last_check)}</b><span class="sc">last check</span></div></div>
    <div class="meter"><div style="width:${m.uptime}%"></div></div>
    <div class="tags"><span class="tag">⏱ every ${m.interval/60} min</span>${m.paused ? '<span class="tag">⏸ paused</span>' : ""}${m.muted ? '<span class="tag">🔕 muted</span>' : ""}
      ${admin ? `<span class="tag">👤 ${m.owner}</span>` : ""}${m.outages ? `<span class="tag">🚨 ${m.outages} outages</span>` : ""}</div></div>`;
}
function viewMon() {
  const d = S.data, c = s => d.filter(m => m.status === s).length;
  const avg = d.length ? (d.reduce((a, m) => a + m.uptime, 0) / d.length).toFixed(1) : "0";
  const list = d.filter(m => (S.filter === "all" || m.status === S.filter) && (m.name + m.url).toLowerCase().includes(S.q));
  return `<div class="strip"><div class="stat"><b>${c("up")}</b><span class="sc">online</span></div><div class="stat"><b>${c("sleeping")}</b><span class="sc">sleeping</span></div>
      <div class="stat"><b>${c("down")}</b><span class="sc">offline</span></div><div class="stat"><b>${avg}%</b><span class="sc">avg uptime</span></div></div>
    <div class="add"><input id="url" type="url" inputmode="url" placeholder="https://your-app.onrender.com" autocomplete="off"><button class="b-violet sc" id="addBtn">add</button></div>
    ${d.length > 3 ? `<div class="add"><input id="q" placeholder="search monitors…" value="${esc(S.q)}"></div>` : ""}
    <div class="chips">${["all","up","sleeping","down"].map(f => `<button class="chip sc ${S.filter === f ? "on" : ""}" data-f="${f}">${f === "all" ? "all " + d.length : LABEL[f] + " " + c(f)}</button>`).join("")}</div>
    <div id="list">${!S.loaded ? '<div class="skel"></div><div class="skel"></div>' : list.length ? list.map(m => monCard(m)).join("") :
      `<div class="empty sc">${d.length ? "nothing matches this filter" : "no monitors yet · paste a link above"}</div>`}</div>`;
}

// ───────────── stats / settings ─────────────
function viewStats() {
  const d = S.data; if (!d.length) return `<div class="empty sc">add a monitor to see insights</div>`;
  const sum = k => d.reduce((a, m) => a + (m[k] || 0), 0), avg = (d.reduce((a, m) => a + m.uptime, 0) / d.length).toFixed(1);
  const rank = [...d].sort((a, b) => a.uptime - b.uptime);
  return `<div class="strip" style="grid-template-columns:repeat(2,1fr)"><div class="stat"><b>${avg}%</b><span class="sc">average uptime</span></div><div class="stat"><b>${sum("total")}</b><span class="sc">total checks</span></div>
    <div class="stat"><b>${sum("wakes")}</b><span class="sc">wake-ups</span></div><div class="stat"><b>${sum("outages")}</b><span class="sc">outages</span></div></div>
    <h3 class="sc">uptime by monitor</h3>` + rank.map(m => `<div class="row" style="display:block"><div class="top"><b>${esc(m.name)}</b><span>${m.uptime}%</span></div>
      <div class="meter" style="margin-top:8px"><div style="width:${m.uptime}%;background:${COL[m.status]}"></div></div>
      <div class="url">avg ${m.avg_ms} ms · ${m.total} checks · ${m.wakes} wake-ups</div></div>`).join("");
}
function viewSettings() {
  const me = S.me || {}; 
  return `<div class="row"><div class="t"><b class="sc">alerts</b><span>Telegram messages when a site sleeps, wakes or goes down</span></div><button class="switch ${me.notify ? "on" : ""}" id="notif" aria-label="toggle alerts"></button></div>
    <div class="row"><div class="t"><b class="sc">monitor slots</b><span>${S.data.length} of ${me.limit ?? "—"} used</span></div></div>
    <div class="row"><div class="t"><b class="sc">refresh</b><span>Reload everything from the server</span></div><button class="b-slate b-sm sc" id="reload">reload</button></div>
    <div class="row"><div class="t"><b class="sc">about</b><span>Uptime Pro by Dotxbrain · your links stay private to you</span></div></div>`;
}

// ───────────── admin tab ─────────────
function viewAdmin() {
  const tabs = [["over","overview"],["users","users"],["mons","monitors"],["ctl","controls"]];
  let body = `<div class="empty">loading…</div>`;
  if (S.atab === "over" && S.ov) { const o = S.ov;
    body = `<div class="strip" style="grid-template-columns:repeat(2,1fr)"><div class="stat"><b>${o.users}</b><span class="sc">users · ${o.banned} banned</span></div><div class="stat"><b>${o.monitors}</b><span class="sc">monitors</span></div>
      <div class="stat"><b>${o.checks}</b><span class="sc">total checks</span></div><div class="stat"><b>${o.avg_uptime}%</b><span class="sc">avg uptime</span></div></div>
      <div class="strip" style="grid-template-columns:repeat(4,1fr)"><div class="stat"><b>${o.up}</b><span class="sc">up</span></div><div class="stat"><b>${o.sleeping}</b><span class="sc">sleep</span></div><div class="stat"><b>${o.down}</b><span class="sc">down</span></div><div class="stat"><b>${o.paused}</b><span class="sc">paused</span></div></div>
      <div class="row"><div class="t"><b class="sc">server</b><span>running ${dur(o.uptime_secs)} · database ${esc(o.db)} · ${o.wakes} wake-ups</span></div></div>
      ${o.broadcast ? `<div class="row"><div class="t"><b class="sc">last broadcast</b><span>${o.broadcast.sent} delivered · ${o.broadcast.failed} failed · ${ago(o.broadcast.t)}</span></div></div>` : ""}`; }
  if (S.atab === "users" && S.users) body = (S.users.users.map(u => `<div class="row" data-user="${u.id}"><div class="t"><b>${u.banned ? "🚫 " : "👤 "}${esc(u.name)}</b><span>${u.id} · ${u.monitors} monitors · seen ${ago(u.seen)}${u.limit ? " · limit " + u.limit : ""}</span></div><button class="b-slate b-sm sc">manage</button></div>`).join("") || `<div class="empty">no users yet</div>`) + `<div class="empty">${S.users.total} users total</div>`;
  if (S.atab === "mons" && S.amons) body = S.amons.monitors.map(m => monCard(m, true)).join("") || `<div class="empty">no monitors</div>`;
  if (S.atab === "ctl" && S.ov) { const s = S.ov.settings, t = (k, n, d) => `<div class="row"><div class="t"><b class="sc">${n}</b><span>${d}</span></div><button class="switch ${s[k] ? "on" : ""}" data-set="${k}" aria-label="${n}"></button></div>`;
    body = t("maintenance","maintenance mode","Blocks everyone except admins") + t("auto_wake","auto wake","Background wake-ups for sleeping sites") + t("signups","new signups","Let new users register") +
      `<div class="row"><div class="t"><b class="sc">default monitor limit</b><span>Per user · currently ${s.max_monitors}</span></div><button class="b-slate b-sm sc" id="limitBtn">change</button></div>
       <h3 class="sc">broadcast</h3><textarea id="bcText" maxlength="3500" placeholder="Message for every user (HTML allowed)"></textarea><button class="b-violet sc" id="bcSend" style="width:100%;margin-top:10px">📣 send to all users</button>`; }
  return `<div class="chips">${tabs.map(([k, n]) => `<button class="chip sc ${S.atab === k ? "on" : ""}" data-at="${k}">${n}</button>`).join("")}</div>${body}`;
}

function render() {
  const tabs = [["mon","📡","monitors"],["stats","📊","insights"],["set","⚙️","settings"]]; if (S.me?.admin) tabs.push(["adm","🛡","admin"]);
  $("nav").innerHTML = tabs.map(([k, i, n]) => `<button class="${S.tab === k ? "on" : ""}" data-tab="${k}"><span>${i}</span><b class="sc">${n}</b></button>`).join("");
  $("checkAll").classList.toggle("hide", S.tab !== "mon");
  const keep = document.activeElement?.id, sel = document.activeElement?.selectionStart;
  $("view").innerHTML = S.tab === "mon" ? viewMon() : S.tab === "stats" ? viewStats() : S.tab === "set" ? viewSettings() : viewAdmin();
  if (keep === "q") { const q = $("q"); q.focus(); q.setSelectionRange(sel, sel); }
}

// ───────────── sheets ─────────────
const openSheet = html => { $("sheet").innerHTML = html; $("bg").classList.add("on"); };
const closeSheet = () => $("bg").classList.remove("on");
$("bg").addEventListener("click", e => { if (e.target.id === "bg") closeSheet(); });
const kvs = rows => rows.map(([k, v]) => `<div class="kv"><span class="sc">${k}</span><b>${esc(v)}</b></div>`).join("");

function resultSheet(title, r, extra = []) {
  openSheet(`<h2 class="sc">${title}</h2>` + kvs([["state", LABEL[r.state]], ["http code", r.code || "—"], ["response", r.ms + " ms"], ["server", r.server], ["size", r.size], ["note", r.note], ...extra]) +
    `<button class="b-violet sc" style="width:100%;margin-top:16px" onclick="closeSheet()">done</button>`);
}
function detailSheet(m, admin) {
  const ivs = (S.me?.interval_opts || [60,120,300,600,900]).map(i => `<button class="chip sc ${m.interval === i ? "on" : ""}" data-a="interval" data-v="${i}" data-id="${m.id}">${i/60} min</button>`).join("");
  openSheet(`<div class="top"><h2>${esc(m.name)}</h2><div class="pill sc ${m.status}"><i></i>${LABEL[m.status]}</div></div><div class="url" style="margin:-6px 0 6px">${esc(m.url)}</div>
    ${sparkSvg(m.spark || [], m.status, 70)}
    ${kvs([["uptime", m.uptime + "%"], ["last response", m.last_ms + " ms · " + (m.last_code || "—")], ["average response", m.avg_ms + " ms"], ["checks", m.total], ["wake-ups", m.wakes], ["outages", m.outages],
      ...(m.down_since ? [["down for", dur(Date.now()/1000 - m.down_since)]] : m.last_outage ? [["last outage", dur(m.last_outage)]] : []), ["last check", ago(m.last_check)], ["added", new Date(m.created*1000).toLocaleDateString()]])}
    ${admin ? "" : `<h3 class="sc">check every</h3><div class="ivs">${ivs}</div>`}
    <div class="acts">
      <button class="b-violet sc" data-a="wake" data-id="${m.id}" ${admin ? 'data-admin="1"' : ""}>☀️ wake up</button><button class="b-mint sc" data-a="ping" data-id="${m.id}" ${admin ? 'data-admin="1"' : ""}>🏓 ping now</button>
      <button class="b-slate sc" data-a="pause" data-id="${m.id}" ${admin ? 'data-admin="1"' : ""}>${m.paused ? "▶️ resume" : "⏸ pause"}</button>
      ${admin ? "" : `<button class="b-slate sc" data-a="mute" data-id="${m.id}">${m.muted ? "🔔 unmute" : "🔕 mute"}</button><button class="b-slate sc" data-a="rename" data-id="${m.id}">✏️ rename</button><button class="b-slate sc" data-a="logs" data-id="${m.id}">📜 logs</button>`}
      <button class="b-coral sc ${admin ? "" : "full"}" data-a="delete" data-id="${m.id}" ${admin ? 'data-admin="1"' : ""}>🗑 delete</button></div>`);
}
function userSheet(u) {
  openSheet(`<h2>${u.banned ? "🚫 " : "👤 "}${esc(u.name)}</h2>${kvs([["telegram id", u.id], ["monitors", u.monitors], ["limit", u.limit || "default"], ["last seen", ago(u.seen)], ["joined", u.joined ? new Date(u.joined*1000).toLocaleDateString() : "—"], ["status", u.banned ? "banned" : "active"]])}
    <div class="acts" style="margin-top:16px"><button class="${u.banned ? "b-mint" : "b-coral"} sc" data-ua="${u.banned ? "unban" : "ban"}" data-uid="${u.id}">${u.banned ? "✅ unban" : "🚫 ban"}</button>
    <button class="b-slate sc" data-ua="limit" data-uid="${u.id}">📏 set limit</button><button class="b-slate sc" data-ua="message" data-uid="${u.id}">✉️ message</button><button class="b-coral sc" data-ua="purge" data-uid="${u.id}">🗑 delete monitors</button></div>`);
}
const byId = id => S.data.find(m => m.id === id) || S.amons?.monitors.find(m => m.id === id);
const replaceMon = m => { S.data = S.data.map(x => x.id === m.id ? m : x); if (S.amons) S.amons.monitors = S.amons.monitors.map(x => x.id === m.id ? m : x); };

// ───────────── data loading ─────────────
async function load() {
  try { if (!S.me) S.me = await api("/api/me"); S.data = await api("/api/list"); S.loaded = true; }
  catch (e) { S.loaded = true; $("view").innerHTML = `<div class="empty">${esc(e.message)}</div>`; return; }
  if (S.tab === "adm") await loadAdmin(); else if (!document.activeElement?.matches?.("input,textarea")) render();
}
async function loadAdmin() {
  try {
    if (S.atab === "over" || S.atab === "ctl") S.ov = await api("/api/admin/overview");
    if (S.atab === "users") S.users = await api("/api/admin/users");
    if (S.atab === "mons") S.amons = await api("/api/admin/monitors");
  } catch (e) { toast(e.message); }
  render();
}

// ───────────── events ─────────────
// Render never wakes a sleeping site for requests coming from inside Render (instant 502), but a request from your phone does.
function kick(url) {
  if (!url) return null; let on = true;
  const hit = () => { if (on) fetch(url, {mode: "no-cors", cache: "no-store"}).catch(() => {}); };
  hit(); const t = setInterval(hit, 5000); return () => { on = false; clearInterval(t); };
}
async function act(id, a, extra = {}, admin = false, btn) {
  if (a === "delete" && !confirm("Delete this monitor?")) return;
  const stopKick = a === "wake" ? kick(byId(id)?.url) : null;
  if (stopKick) toast("Waking from your phone…");
  btn && (btn.disabled = true, (a === "wake" || a === "ping") && btn.classList.add("busy"));
  try {
    const j = await api(admin ? "/api/admin/monitor" : "/api/act", {id, act: a, ...extra});
    if (j.deleted) { S.data = S.data.filter(m => m.id !== id); if (S.amons) S.amons.monitors = S.amons.monitors.filter(m => m.id !== id); closeSheet(); render(); toast("Deleted"); return; }
    replaceMon(j.monitor); render();
    if (a === "ping") { buzz(j.result.state === "up" ? "success" : "warning"); resultSheet(j.result.state === "up" ? "ping successful" : "site is not awake", j.result); }
    else if (a === "wake") { const r = j.result; buzz(r.ok ? "success" : "error"); resultSheet(r.ok ? (r.woke ? "wake-up successful" : "already awake") : "could not wake", r, [["woke in", r.secs + "s"], ["attempts", r.attempts]]); }
    else { detailSheet(j.monitor, admin); toast("Saved"); }
  } catch (err) { buzz("error"); toast(err.message); btn && (btn.disabled = false, btn.classList.remove("busy")); }
  finally { stopKick?.(); }
}

document.addEventListener("click", async e => {
  const t = e.target, b = t.closest("button"), card = t.closest("[data-open]");
  if (b?.dataset.tab) { S.tab = b.dataset.tab; render(); if (S.tab === "adm") loadAdmin(); return; }
  if (b?.dataset.f) { S.filter = b.dataset.f; render(); return; }
  if (b?.dataset.at) { S.atab = b.dataset.at; render(); loadAdmin(); return; }
  if (b?.dataset.a) {
    const {a, id, v} = b.dataset, admin = !!b.dataset.admin;
    if (a === "logs") { try { const logs = await api("/api/logs?id=" + id);
      openSheet(`<h2 class="sc">smart logs</h2>` + (logs.map(l => `<div class="log">${ICON[l.s]} ${KIND[l.k] || "•"} <span>${l.c || "—"} · ${l.ms}ms</span><em>${new Date(l.t*1000).toLocaleTimeString([], {hour:"2-digit", minute:"2-digit", second:"2-digit"})}</em></div>`).join("") || `<div class="empty sc">no logs yet</div>`)); } catch (err) { toast(err.message); } return; }
    if (a === "rename") { const n = prompt("New name", byId(id)?.name || ""); if (n) act(id, "rename", {value: n}); return; }
    return act(id, a, a === "interval" ? {value: +v} : {}, admin, b);
  }
  if (card) { const admin = !!card.dataset.admin, m = byId(card.dataset.open); if (m) detailSheet(m, admin); return; }
  if (b?.id === "addBtn") { const v = $("url").value.trim(); if (!v) return; b.disabled = true;
    try { const m = await api("/api/add", {url: v}); S.data.push(m); render(); buzz("success"); toast("Monitor added"); } catch (err) { buzz("error"); toast(err.message); b.disabled = false; } return; }
  if (b?.id === "checkAll") { b.disabled = true; b.classList.add("busy");
    try { const j = await api("/api/checkall", {}); S.data = S.data.map(m => j.monitors.find(x => x.id === m.id) || m); buzz("success"); toast(`${j.up} of ${j.monitors.length} online`); render(); }
    catch (err) { buzz("error"); toast(err.message); } b.disabled = false; b.classList.remove("busy"); return; }
  if (b?.id === "notif") { try { const j = await api("/api/prefs", {notify: !S.me.notify}); S.me.notify = j.notify; render(); toast(j.notify ? "Alerts on" : "Alerts off"); } catch (err) { toast(err.message); } return; }
  if (b?.id === "reload") { S.loaded = false; render(); load(); return; }
  if (b?.dataset.set) { const k = b.dataset.set;
    try { S.ov.settings = await api("/api/admin/settings", {key: k, value: !S.ov.settings[k]}); render(); toast("Saved"); } catch (err) { toast(err.message); } return; }
  if (b?.id === "limitBtn") { const n = parseInt(prompt("Default monitors per user (1–100)", S.ov.settings.max_monitors)); if (!n) return;
    try { S.ov.settings = await api("/api/admin/settings", {key: "max_monitors", value: n}); render(); toast("Saved"); } catch (err) { toast(err.message); } return; }
  if (b?.id === "bcSend") { const text = $("bcText").value.trim(); if (!text || !confirm("Send this message to ALL users?")) return;
    try { await api("/api/admin/broadcast", {text}); $("bcText").value = ""; toast("Broadcast started"); setTimeout(loadAdmin, 4000); } catch (err) { toast(err.message); } return; }
  const row = t.closest("[data-user]"); if (row && !b?.dataset.ua) { const u = S.users.users.find(x => x.id == row.dataset.user); if (u) userSheet(u); return; }
  if (b?.dataset.ua) { const {ua, uid} = b.dataset, body = {uid: +uid, act: ua};
    if (ua === "limit") { const n = prompt("Monitor limit for this user (0 = default)"); if (n === null) return; body.value = +n; }
    if (ua === "message") { const n = prompt("Message to send"); if (!n) return; body.value = n; }
    if (ua === "purge" && !confirm("Delete ALL monitors of this user?")) return;
    try { const u = await api("/api/admin/user", body); S.users.users = S.users.users.map(x => x.id === u.id ? u : x); userSheet(u); render(); toast("Done"); } catch (err) { toast(err.message); } }
});
document.addEventListener("keydown", e => { if (e.key === "Enter" && e.target.id === "url") $("addBtn").click(); if ((e.key === "Enter" || e.key === " ") && e.target.matches?.(".card")) { e.preventDefault(); e.target.click(); } });
document.addEventListener("input", e => { if (e.target.id === "q") { S.q = e.target.value.toLowerCase(); render(); } });

render(); load(); setInterval(load, 30000);
</script>
</body>
</html>
