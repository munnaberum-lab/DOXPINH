# Dotxbrain Uptime Pro — external keep-alive.
# A sleeping Render service cannot wake itself; this job knocks on its door every 5 minutes (like opening it in a
# browser) and waits up to ~2 minutes for the cold start to finish.
# Setup: GitHub repo → Settings → Secrets and variables → Actions → New secret
#        APP_URL = https://<your-service>.onrender.com
name: keepalive
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wake / ping the bot
        env:
          APP_URL: ${{ secrets.APP_URL }}
        run: |
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -m 60 -w "%{http_code}" "$APP_URL/health" || true)
            echo "try $i -> HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 10
          done
          echo "service did not answer" && exit 1
